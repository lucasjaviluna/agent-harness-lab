name: Agent Harness Lab CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify TypeScript, regression tests and installable tarball
        run: npm run release:verify
      - name: Enforce supported Node runtime
        run: node dist/lab-cli.js readiness --enforce
